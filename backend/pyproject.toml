[project]
name = "nse-analytics-api"
version = "1.0.0"
description = "NSE Quantitative Trading Platform — FastAPI Backend"
requires-python = ">=3.11"

dependencies = [
    # ── Web Framework ──
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # ── Database ──
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",

    # ── Redis ──
    "redis[hiredis]>=5.2.0",

    # ── Auth & Security ──
    "pyjwt>=2.10.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.18",

    # ── Data & ML ──
    "yfinance>=0.2.50",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.6.0",
    "scipy>=1.14.0",

    # ── Background Tasks ──
    "apscheduler>=3.10.0",

    # ── Config ──
    "pydantic-settings>=2.7.0",

    # ── HTTP (news scraping) ──
    "httpx>=0.28.0",
    "feedparser>=6.0.0",

    # ── Utilities ──
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "factory-boy>=3.3.0",
    "coverage>=7.6.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
dev = "app.main:run_dev"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"
